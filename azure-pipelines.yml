# Starting template for production deploys to Azure App Service (Linux, Node).
# Adjust triggers, service connection name, and app name for your setup -
# this is meant as a base, not a drop-in final pipeline.

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    jobs:
      - job: BuildApp
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: 'Install Node.js'

          # pnpm itself is only ever installed via npm/corepack, once, here -
          # everything after this uses pnpm exclusively per team convention.
          - script: |
              corepack enable
              corepack prepare pnpm@11.18.0 --activate
            displayName: 'Enable pnpm via corepack'

          - script: pnpm install --frozen-lockfile
            displayName: 'pnpm install'

          - script: pnpm build
            displayName: 'Build (vite build)'

          - script: |
              mkdir deploy
              cp -r dist deploy/dist
              cp server.js deploy/server.js
              cp package.json deploy/package.json
              cp pnpm-lock.yaml deploy/pnpm-lock.yaml
              cd deploy
              pnpm install --prod --frozen-lockfile
            displayName: 'Assemble production package (server + prod deps only)'

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(Build.SourcesDirectory)/deploy'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/procurex-react.zip'
            displayName: 'Zip deploy package'

          - publish: '$(Build.ArtifactStagingDirectory)/procurex-react.zip'
            artifact: procurex-react

  - stage: DeployProd
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployAppService
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: '<service-connection-name>'
                    appType: webAppLinux
                    appName: '<app-service-name>'
                    package: '$(Pipeline.Workspace)/procurex-react/procurex-react.zip'
                    # Runs node directly rather than "pnpm start" - App
                    # Service's runtime only needs Node, not pnpm, since the
                    # zip already ships fully-resolved production node_modules.
                    startUpCommand: 'node server.js'

# Notes for App Service configuration (one-time, in the Azure portal or
# via IaC, not this pipeline):
#   - Set app setting SCM_DO_BUILD_DURING_DEPLOYMENT=false, since the
#     zip already contains built output + production node_modules.
#   - App Service Linux provides PORT automatically; server.js reads
#     process.env.PORT, so no extra WEBSITES_PORT setting is needed.
